appId: com.pontistudios.hakumi.dev
---
# Switches between the Chats, Notes, and Time contexts in the Workspace
# top toolbar. Context changes remain local to the Workspace route.
- runFlow: startup.yaml
- assertVisible:
    id: inbox-composer-input
- assertVisible:
    id: workspace-context-chats
- tapOn:
    id: workspace-context-chats
- assertVisible: Chats
- assertVisible:
    id: inbox-composer-input
- tapOn:
    id: workspace-context-notes
- assertVisible: Notes
- assertVisible:
    id: inbox-composer-input
# Time is embedded in this same screen and owns the natural-language composer.
- tapOn:
    id: workspace-context-calendar
- assertVisible:
    id: workspace-context-chats
- assertVisible:
    id: calendar-screen
- assertVisible:
    id: calendar-input
- assertNotVisible:
    id: inbox-composer-input
- tapOn:
    id: workspace-context-notes
- assertVisible:
    id: inbox-composer-input
