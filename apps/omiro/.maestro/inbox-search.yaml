appId: com.pontistudios.hakumi.dev
---
# Covers expand-on-tap search across the Chats and Notes contexts. The
# focused state replaces the idle header composition with a field and Cancel.
- runFlow: startup.yaml

- assertNotVisible:
    id: workspace-context-chats
- tapOn: Search
- assertVisible:
    id: workspace-search-input
- assertVisible:
    id: workspace-search-cancel
- assertNotVisible:
    id: workspace-context-chats
- tapOn: Cancel
- assertVisible:
    id: inbox-composer-input
# Switching contexts while search is active re-scopes it instead of closing it.
- tapOn:
    id: workspace-context-notes
- tapOn: Search
- assertVisible:
    id: workspace-search-input
- assertVisible:
    id: workspace-context-chats
- inputText: project
- tapOn:
    id: workspace-search-cancel
- assertVisible:
    id: workspace-context-notes
