appId: com.pontistudios.hakumi.dev
---
# Proves the unified Time surface loads calendar events with the JavaScript
# ISO-8601 timestamps used by the app, and keeps the natural-language input
# available at the bottom of the screen.
- runFlow: startup.yaml
- tapOn:
    id: workspace-context-calendar
- assertVisible:
    id: calendar-screen
- extendedWaitUntil:
    visible:
      id: calendar-events-ready
    timeout: 20000
- assertNotVisible:
    id: calendar-answer-state
- assertVisible:
    id: calendar-input
