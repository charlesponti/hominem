appId: com.pontistudios.hakumi.dev
---
# Deterministic smoke/regression flow for the main-app Calendar context.
# Prerequisite: a signed-in test account with iOS Calendar access already
# granted and Apple Intelligence available to the simulator.
# The shared startup flow also recovers from a persisted chat or note detail
# route, which makes this flow safe to run after other Maestro flows.
- runFlow: startup.yaml
- extendedWaitUntil:
    visible:
      id: workspace-context-notes
    timeout: 45000

# Enter the main Calendar section by stable ID.
- tapOn:
    id: workspace-context-calendar
- assertVisible:
    id: calendar-screen
- assertVisible:
    id: calendar-input

# Exercise the query action and wait for the actual response state.
- tapOn:
    id: calendar-input
- eraseText: 200
- inputText: What do I have going on today?
- assertVisible:
    id: calendar-ask-button
- back
- tapOn:
    id: calendar-ask-button
- assertVisible:
    id: calendar-thinking-state
- extendedWaitUntil:
    visible:
      id: calendar-answer-content
    timeout: 45000
- assertVisible:
    id: calendar-answer-content

# Verify returning to the prior main-app context and re-entering Calendar.
- tapOn:
    id: workspace-context-notes
- assertVisible:
    id: inbox-composer-input
- tapOn:
    id: workspace-context-calendar
- assertVisible:
    id: calendar-screen
