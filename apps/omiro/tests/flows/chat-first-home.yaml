appId: com.pontistudios.hakumi.dev
---
- runFlow: ../subflows/open-dev-home.yaml
- openLink: 'hakumi-dev:///new-chat'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'new-chat-composer-input'
- tapOn:
    id: 'new-chat-composer-input'
- eraseText: 100
- inputText: 'Start a new chat from the chat-first home'
- pressKey: BACK
- assertVisible:
    id: 'new-chat-submit'
- tapOn:
    id: 'new-chat-submit'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: 'chat-composer-input'
