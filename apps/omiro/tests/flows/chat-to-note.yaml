appId: com.pontistudios.hakumi.dev
---
# Flow: Chat → Note
# Opens a conversation, sends a message (mocked locally via the MMKV test-mode
# flag so no real AI tokens are consumed), transforms the conversation to a
# note via the header menu, and asserts the note appears back in the inbox.
#
# Test mode only mocks the chat-detail send path (useSendMessage), not the
# inbox start-chat path, so this flow starts from an existing conversation.

# Write the test-mode flag to MMKV and land on the inbox.
- openLink: 'hakumi-dev://enable-test-mode'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../subflows/ensure-authenticated.yaml
- assertVisible:
    id: 'inbox-composer-input'
- takeScreenshot: /tmp/omiro_flow_1_home

# Open the most recent conversation.
- tapOn:
    id: 'inbox-item-chat-open'
    index: 0
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'chat-composer-input'
- takeScreenshot: /tmp/omiro_flow_2_chat_opened

# Send a message through the chat composer; the mock streams 'mock AI response'.
- tapOn:
    id: 'chat-composer-input'
- eraseText: 100
- inputText: 'What are the key principles of good product design?'
- takeScreenshot: /tmp/omiro_flow_3_typed
- tapOn:
    id: 'composer-submit-message'
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: 'mock AI response'
- takeScreenshot: /tmp/omiro_flow_4_ai_responded

# Open the conversation actions menu from the header.
- tapOn: 'Conversation actions'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: /tmp/omiro_flow_5_menu_open

# Tap "Create note" in the native menu.
- tapOn: 'Create note'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: /tmp/omiro_flow_6_review_shown

# Accept the classification review.
- tapOn:
    id: 'classification-review-accept'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: /tmp/omiro_flow_7_accepted

# Return to the inbox via the enable-test-mode deep link (redirects to '/').
- openLink: 'hakumi-dev://enable-test-mode'
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'inbox-composer-input'
- takeScreenshot: /tmp/omiro_flow_8_inbox

# The transformed conversation is a note row in the inbox.
- assertVisible:
    id: 'inbox-item-note'
- takeScreenshot: /tmp/omiro_flow_9_note_visible
