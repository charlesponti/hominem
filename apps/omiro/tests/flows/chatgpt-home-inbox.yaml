appId: com.pontistudios.hakumi.dev
---
- runFlow: ../subflows/open-dev-home.yaml
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible:
    id: 'workspace-context-chats'
- assertVisible:
    id: 'workspace-search-button'
- assertVisible:
    id: 'inbox-overflow-action'
- assertVisible:
    id: 'inbox-composer-input'
- assertVisible: 'Notes'
- tapOn: 'Chats'
- assertVisible: 'Recents'
- tapOn:
    id: 'inbox-composer-input'
- eraseText: 100
- inputText: 'Quick capture draft'
- assertVisible:
    id: 'composer-save-note'
- back
- tapOn:
    id: 'inbox-overflow-action'
- assertVisible: 'Archived chats'
- tapOn: 'Archived chats'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: 'Archived chats'
- tapOn: 'index'
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: 'inbox-overflow-action'
- assertVisible: 'Settings'
- tapOn: 'Settings'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: 'Settings'
- tapOn: 'index'
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: 'workspace-search-button'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: 'workspace-search-input'
- tapOn: 'Close search'
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: 'Chats'
- tapOn:
    id: 'inbox-composer-input'
- eraseText
- inputText: 'Start a new chat from home'
- tapOn:
    id: 'composer-submit-chat'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: 'Start a new chat from home'
- assertVisible: 'Thinking...'
- assertVisible:
    id: 'chat-composer-input'
- tapOn:
    id: 'BackButton'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'workspace-search-button'
- tapOn:
    id: 'workspace-search-input'
- inputText: 'Start a new chat from home'
- assertVisible: 'Start a new chat from home'
