appId: com.pontistudios.hakumi.dev
---
- launchApp
- tapOn:
    id: workspace-context-time
- assertVisible:
    id: time-screen
- assertVisible:
    id: time-stream
- assertVisible:
    id: time-composer-input
- tapOn:
    id: time-section-past
- waitForAnimationToEnd
- takeScreenshot: /tmp/omiro-time-past-tab
- tapOn:
    id: time-section-unscheduled
- waitForAnimationToEnd
- takeScreenshot: /tmp/omiro-time-unscheduled-tab
- tapOn:
    id: time-section-now
- waitForAnimationToEnd
- takeScreenshot: /tmp/omiro-time-now-tab
- tapOn:
    id: time-composer-input
- inputText: Buy milk
- assertVisible:
    id: time-composer-submit
