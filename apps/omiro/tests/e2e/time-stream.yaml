appId: com.pontistudios.hakumi.dev
---
- launchApp
- assertVisible:
    id: home-screen
- tapOn:
    id: home-time-button
- assertVisible:
    id: time-screen
- assertVisible:
    id: time-stream
- tapOn:
    id: time-unscheduled-button
- waitForAnimationToEnd
- assertVisible:
    id: unscheduled-tasks-screen
- takeScreenshot: /tmp/omiro-time-unscheduled-tab
- tapOn:
    id: unscheduled-task-.+-schedule
- assertVisible:
    id: time-block-editor
- waitForAnimationToEnd
- takeScreenshot: /tmp/omiro-time-unscheduled-schedule
