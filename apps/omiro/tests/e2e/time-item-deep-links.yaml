appId: com.pontistudios.hakumi.dev
---
- openLink: hakumi-dev://time/event/time-fixture-editable
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../subflows/ensure-authenticated.yaml
- openLink: hakumi-dev://time/event/time-fixture-editable
- assertVisible:
    id: time-block-editor
- swipe:
    start: '50%, 35%'
    end: '50%, 95%'
- assertVisible:
    id: time-stream
