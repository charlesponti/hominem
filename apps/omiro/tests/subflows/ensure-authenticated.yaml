appId: com.pontistudios.hakumi.dev
---
# Full E2E login, composed of the two phases. The OTP must be injected
# upfront (`maestro test -e OTP=...`), which means the code has to exist
# BEFORE this flow sends it — that only works when some earlier step already
# triggered a send for the same email without completing it.
#
# Normal path: use the tests/scripts/maestro-auth.sh wrapper instead. It runs
# phase 1 (send), reads the fresh code from the scripted mailbox, then runs
# phase 2 (verify). OTPs are real random codes, never served over HTTP —
# Maestro's JS sandbox has no filesystem access, so `-e` injection from a
# shell wrapper is the only way the code enters a flow.
#
# No-op when the app is already authenticated.
- runFlow: auth-send-otp.yaml
- runFlow: auth-verify-otp.yaml
