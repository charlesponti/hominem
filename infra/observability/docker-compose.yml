services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:13133:13133'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:13133/']
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      jaeger:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.70.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '127.0.0.1:16686:16686'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:14269/']
      interval: 5s
      timeout: 3s
      retries: 10
