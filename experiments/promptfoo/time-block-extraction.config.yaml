description: 'Structured time-block extraction — intent, temporal grounding, and no-invention safety'

providers:
  - id: ollama:chat:gemma4:e2b-mlx
    label: gemma4-e2b-mlx (local)
    config:
      temperature: 0
      max_tokens: 768
  - id: openrouter:qwen/qwen3.5-flash-02-23
    label: qwen3.5-flash (production candidate)
    config:
      temperature: 0
      max_tokens: 768
  - id: openrouter:google/gemini-2.5-flash-lite
    label: gemini-2.5-flash-lite (comparison)
    config:
      temperature: 0
      max_tokens: 768

prompts:
  - id: file://prompts/time-block-extraction.json
    label: v1-production-contract

tests:
  - vars:
      caseId: fixed-event
      referenceDateTime: '2026-07-25T11:17:00-07:00'
      timezone: America/Los_Angeles
      calendarContext: 'No calendar data supplied.'
      conversationContext: 'None.'
      input: 'Meeting with Sarah at 10 AM tomorrow for an hour'
      expectedIntent: add_event
      expectedTitlePattern: 'meeting|sarah'
      expectedParticipants: Sarah
      expectedDuration: 60
      expectedStartTime: '2026-07-26T10:00:00-07:00'
      expectedEndTime: '2026-07-26T11:00:00-07:00'
      nullFields: 'location,scheduling_window_start,scheduling_window_end,deadline_fixed'
    assert:
      - type: javascript
        value: file://assertions/time-block-extraction.js

  - vars:
      caseId: flexible-task
      referenceDateTime: '2026-07-25T11:17:00-07:00'
      timezone: America/Los_Angeles
      calendarContext: 'No calendar data supplied.'
      conversationContext: 'None.'
      input: 'Need to write pitch deck tomorrow 2h'
      expectedIntent: add_task
      expectedTitlePattern: 'write.*pitch|pitch.*deck'
      expectedDuration: 120
      expectedWindowStart: '2026-07-26T00:00:00-07:00'
      expectedWindowEnd: '2026-07-27T00:00:00-07:00'
      nullFields: 'participants,location,start_time,end_time,deadline_fixed'
    assert:
      - type: javascript
        value: file://assertions/time-block-extraction.js

