version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(deps)'
