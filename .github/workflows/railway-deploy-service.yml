name: railway-deploy-service

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ''
      config_path:
        required: true
        type: string
    secrets:
      service_target:
        required: true
      RAILWAY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    concurrency:
      group: railway-deploy-${{ inputs.service_name }}
      cancel-in-progress: false
    env:
      SERVICE: ${{ secrets.service_target }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE_NAME: ${{ inputs.service_name }}
      CONFIG_PATH: ${{ inputs.config_path }}
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '26.5.0'

      - name: validate-environment
        run: |
          set -euo pipefail
          test -n "$SERVICE" || { echo "Missing Railway service target for $SERVICE_NAME"; exit 1; }
          test -n "$RAILWAY_TOKEN" || { echo 'Missing Railway token'; exit 1; }

      - name: deploy-to-railway
        run: bash just/deploy.sh "$SERVICE_NAME" "$CONFIG_PATH"
