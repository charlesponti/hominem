name: railway-deploy-service

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ''
      config_path:
        required: true
        type: string
    secrets:
      service_target:
        required: true
      RAILWAY_TOKEN:
        required: true

concurrency:
  group: railway-deploy-${{ inputs.service_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICE: ${{ secrets.service_target }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: validate-env
        run: |
          test -n "$SERVICE" || {
            echo "Missing Railway service target secret for '${{ inputs.service_name }}'."
            exit 1
          }
          test -n "$RAILWAY_TOKEN" || {
            echo "Missing RAILWAY_TOKEN secret."
            exit 1
          }

      - name: deploy-to-railway
        run: bash just/deploy.sh "${{ inputs.service_name }}" "${{ inputs.config_path }}"

      - name: clear-github-packages-token
        if: always() && env.SERVICE != '' && env.RAILWAY_TOKEN != ''
        run: printf 'unused\n' | railway variable set GITHUB_PACKAGES_TOKEN --stdin --service "$SERVICE" --skip-deploys
