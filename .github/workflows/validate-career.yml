name: validate-career

on:
  push:
    branches: [main]
    paths:
      - 'apps/career/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'tsconfig.profiles/**'
      - 'justfile'
      - 'scripts/**'
      - '.github/actions/setup-pnpm-workspace/**'
      - '.github/workflows/validate-career.yml'
      - '.github/workflows/_validate-app.yml'
  pull_request:
    branches: [main, preview]
    paths:
      - 'apps/career/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'tsconfig.profiles/**'
      - 'justfile'
      - 'scripts/**'
      - '.github/actions/setup-pnpm-workspace/**'
      - '.github/workflows/validate-career.yml'
      - '.github/workflows/_validate-app.yml'

concurrency:
  group: validate-career-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate-career:
    uses: ./.github/workflows/_validate-app.yml
    with:
      package-filter: '@hominem/career'
      # Matches apps/career's own dev port (vite.config.ts / .env.example) --
      # middleware.test.ts asserts hosted-login redirects return here.
      public-app-url: 'http://localhost:4451'
    secrets: inherit
