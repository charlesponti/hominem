name: validate-auth

on:
  push:
    branches: [main]
    paths: &auth-paths
      - 'packages/auth/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'tsconfig.profiles/**'
      - 'just/**'
      - 'justfile'
      - 'scripts/**'
      - '.github/actions/setup-pnpm-workspace/**'
      - '.github/workflows/validate-auth.yml'
  pull_request:
    branches: [main]
    paths: *auth-paths

concurrency:
  group: validate-auth-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '26.5.0'

      - name: validate-source
        run: |
          set -euo pipefail
          pnpm format:check --filter @ponti-studios/auth...
          pnpm lint --filter @ponti-studios/auth...
          pnpm typecheck --filter @ponti-studios/auth...
          pnpm test --filter @ponti-studios/auth...
