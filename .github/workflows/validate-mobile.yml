name: validate-mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/omiro/**'
      - 'packages/**'
      - 'services/api/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'tsconfig.profiles/**'
      - 'justfile'
      - 'scripts/**'
      - '.github/actions/setup-pnpm-workspace/**'
      - '.github/workflows/validate-mobile.yml'
      - '.github/workflows/_validate-app.yml'
  pull_request:
    branches: [main, preview]
    paths:
      - 'apps/omiro/**'
      - 'packages/**'
      - 'services/api/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'tsconfig.profiles/**'
      - 'justfile'
      - 'scripts/**'
      - '.github/actions/setup-pnpm-workspace/**'
      - '.github/workflows/validate-mobile.yml'
      - '.github/workflows/_validate-app.yml'

concurrency:
  group: validate-mobile-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate-mobile:
    uses: ./.github/workflows/_validate-app.yml
    with:
      package-filter: '@hominem/omiro'
      extra-run: 'NODE_ENV=production pnpm --filter @hominem/omiro run export:embed:ios'
    secrets: inherit
