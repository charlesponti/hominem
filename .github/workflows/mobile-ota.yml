name: mobile-ota

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Green main commit containing the JavaScript-only fix
        required: true
        default: main
        type: string
      rollout_percentage:
        description: Initial production rollout percentage
        required: true
        default: '10'
        type: choice
        options: ['10', '50', '100']

concurrency:
  group: mobile-ota-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish controlled production update
    runs-on: ubuntu-latest
    environment: omiro-production
    timeout-minutes: 45

    steps:
      - name: checkout-release-ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: validate-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm format:check
          pnpm lint --filter=@hominem/omiro...
          pnpm typecheck --filter=@hominem/omiro...
          pnpm build --filter=@hominem/omiro...
          pnpm test --filter=@hominem/omiro...

      - name: publish-production-update
        working-directory: apps/omiro
        env:
          APP_ENV: production
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
        run: |
          rollout_flag=()
          if [ "$ROLLOUT_PERCENTAGE" != "100" ]; then
            rollout_flag=(--rollout-percentage "$ROLLOUT_PERCENTAGE")
          fi
          pnpm dlx eas-cli@21.2.0 update \
            --platform ios \
            --channel production \
            --environment production \
            "${rollout_flag[@]}" \
            --message "Production OTA from ${{ inputs.ref }}" \
            --non-interactive
