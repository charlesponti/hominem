name: deploy-workers

on:
  workflow_run:
    workflows: [validate-api]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-workers:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/railway-deploy-service.yml
    secrets:
      service_target: ${{ secrets.RAILWAY_SERVICE_WORKERS }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    with:
      service_name: workers
      checkout_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      config_path: services/api/worker/railway.json
