name: deploy-mobile

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Green main commit or tag to release
        required: true
        default: main
        type: string

concurrency:
  group: deploy-mobile
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  release-candidate:
    name: release
    runs-on: ubuntu-latest
    environment: omiro-testflight
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: checkout-release-ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: validate-mobile
        run: |
          pnpm format:check
          pnpm lint --filter=@hominem/omiro...
          pnpm typecheck --filter=@hominem/omiro...
          pnpm build --filter=@hominem/omiro...
          pnpm test --filter=@hominem/omiro...

      - name: build-and-submit-production
        working-directory: apps/omiro
        run: >-
          pnpm dlx eas-cli@21.2.0 build
          --platform ios
          --profile production
          --auto-submit
          --non-interactive

      - name: write-release-manifest
        working-directory: apps/omiro
        run: |
          mkdir -p ../../artifacts
          pnpm dlx eas-cli@21.2.0 build:list --platform ios --build-profile production --git-commit-hash "${GITHUB_SHA}" --limit 1 --json --non-interactive > ../../artifacts/omiro-release-build.json
          node scripts/create-release-manifest.mjs ../../artifacts/omiro-release-build.json ../../artifacts/omiro-release-manifest.json

      - name: upload-release-manifest
        uses: actions/upload-artifact@v7
        with:
          name: omiro-release-${{ github.run_id }}
          path: artifacts/omiro-release-manifest.json
