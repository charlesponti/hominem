name: deploy-mobile

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Green main commit or tag to release
        required: true
        default: main
        type: string

concurrency:
  group: deploy-mobile
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  release-candidate:
    name: release
    runs-on: ubuntu-latest
    environment: omiro-testflight
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: checkout-release-ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: validate-mobile
        run: |
          pnpm format:check
          pnpm lint --filter=@hominem/omiro...
          pnpm typecheck --filter=@hominem/omiro...
          pnpm build --filter=@hominem/omiro...
          pnpm test --filter=@hominem/omiro...

      - name: build-and-submit-production
        working-directory: apps/omiro
        run: >-
          pnpm exec eas-cli build
          --platform ios
          --profile production
          --auto-submit
          --non-interactive
